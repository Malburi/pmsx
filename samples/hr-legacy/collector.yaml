# PMS-X 수집기 설정 - 샘플 인사시스템(HR)
# 상대 경로는 이 파일 위치 기준
system:
  code: HR
  name: 인사시스템
  uiTech: [jsp-jquery]
  serverTech: [spring, mybatis]
  dbType: oracle

source:
  root: .                                   # 소스 파일 경로 표기 기준 (키·file 값에 쓰임)
  webapp: src/main/webapp                   # JS 키는 이 기준 웹 경로(/js/...)로 표기
  jsp: src/main/webapp/WEB-INF/jsp
  java: src/main/java
  mapper: src/main/resources/mapper
  includeSnippets: true                     # 고객사 정책상 소스 반입 불가면 false
  commonScripts: [/js/cmm/]                 # 공통 함수로 표시(하위 흐름 접기)

# 프로젝트 고유 공통 함수 → 요청/화면이동 해석 규칙
frontApis:
  gfn_ajax:     { urlArg: 0, method: POST }
  gfn_setCombo: { urlArg: 1, method: GET }
  gfn_excel:    { urlArg: 0, method: GET }
frontNavigations:
  gfn_popup:    { urlArg: 0 }

db:
  schema: HR
  ddlFiles: [db/ddl.sql, db/procedures.sql]  # DB 접속 없이 DDL로 메타 수집
  # type: oracle                            # DB 직접 수집(읽기 전용) — connection 이 있으면 사용
  # schemas: [HR]
  # connection:
  #   host: 10.0.0.5
  #   port: 1521
  #   service: HRDEV
  #   user: PMSX_RO
  #   passwordEnv: PMSX_DB_PW              # 비밀번호는 환경변수로만

menu:
  csv: db/menu.csv                          # 또는 sqlFile: db/menu.sql
  columns: { id: MENU_ID, parent: UP_MENU_ID, name: MENU_NM, url: MENU_URL, order: SORT_ORD }

capture:
  enabled: true
  baseUrl: http://127.0.0.1:8091
  denyHosts: [hr.example.go.kr]             # 운영계 - 일치하면 실행 거부
  browserChannel: chrome                    # 설치된 Chrome 사용 (msedge 가능, 브라우저 다운로드 없음)
  # browserPath: C:/portable/chrome/chrome.exe   # 포터블 브라우저 (지정 시 channel 무시)
  deviceScaleFactor: 1                      # 캡처 배율 → captures[].scale
  extraEvents: true                         # change·그리드 행 dblclick 도 시도
  headless: true
  viewport: { width: 1280, height: 800 }
  login:
    url: /login.do
    steps:
      - fill: { selector: "#userId", value: tester }
      - fill: { selector: "#userPw", valueEnv: PMSX_TEST_PW, default: test1234 }
      - click: "#btnLogin"
      - waitUrl: "**/main.do"
  allowRequests: ["*/list.do", "*/popList.do", "*/detail.do", "*/summary.do", "/cmm/code/*.do"]
  dangerLabels: [삭제, 저장, 등록, 승인, 결재, 전송, 발송, 확정, 마감]
  dangerIds: [del, save, apprv, confirm, regist]
  maskSelectors: []
  clickWaitMs: 700
  pageTimeoutMs: 15000

inference:
  minEvidence: 1                            # 추정 관계 최소 근거 수 (운영 권장 3)

output: out
