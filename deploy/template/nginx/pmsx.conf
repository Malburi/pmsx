# PMS-X 리버스 프록시 예시 (TLS 종단). /etc/nginx/conf.d/pmsx.conf 등에 배치
# 인증서 경로·server_name 을 고객사 환경에 맞게 바꾼다. 업로드(수집 패키지) 크기 300MB 허용.

server {
    listen 80;
    server_name pmsx.customer.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pmsx.customer.local;

    ssl_certificate     /etc/nginx/certs/pmsx.crt;
    ssl_certificate_key /etc/nginx/certs/pmsx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 300m;
    proxy_read_timeout   300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
